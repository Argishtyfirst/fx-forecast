[project]
name = "fxf"
version = "0.1.0"
description = "FX Forecast Tool: calibrated EUR/USD and USD/AMD forecast bands"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "arch>=7.0",
    "lightgbm>=4.5",
    "anthropic>=0.40",
    "typer>=0.12",
    "apscheduler>=3.10,<4",
    "holidays>=0.58",
    "python-dateutil>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.110",
    "respx>=0.21",
    "ruff>=0.6",
]

[project.scripts]
fxf = "fxf.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fxf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "db: needs the Postgres test database (docker compose up -d db)",
    "network: hits a live external source (skipped unless FXF_LIVE_TESTS=1)",
    "slow: long-running test",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.uv]
cache-dir = ".uv-cache"

# Vercel (project Root Directory = backend): FastAPI function + dashboard on the CDN.
[tool.vercel]
entrypoint = "app:app"

[tool.vercel.scripts]
build = "sh scripts/vercel_build.sh"
