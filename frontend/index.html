<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Calibrated 1D, 1W and 1M ranges for EUR/USD and USD/AMD." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>FX Forecast</title>
    <script>
      // Apply the stored theme before first paint, so dark mode does not flash light.
      try {
        var t = localStorage.getItem("fxf-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
