services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fxf
      POSTGRES_PASSWORD: fxf
      POSTGRES_DB: fxf
    ports:
      - "5433:5432"
    volumes:
      - fxf-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fxf"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  fxf-pg:
